# NOTA: Ademas de NODE_VERSION, este servicio requiere las siguientes
# variables configuradas manualmente en el dashboard de Render
# (Settings -> Environment) porque son secretos y no se declaran aqui:
#   FIREBASE_API_KEY, FIREBASE_APP_ID, FIREBASE_AUTH_DOMAIN,
#   FIREBASE_MESSAGING_SENDER_ID, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET,
#   GROQ_API_KEY
# Y CRITICO para que el login con Google funcione en el backend:
#   FIREBASE_SERVICE_ACCOUNT
services:
  - type: web
    name: cuaderno-glass
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
